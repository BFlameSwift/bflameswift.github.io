# Aggregate only successful HTML GETs. No IP, URL, query or user agent is stored.
map $uri $me_stats_page {
    default 0;
    / 1;
    ~\.html$ 1;
}
map $http_user_agent $me_stats_browser {
    default 1;
    "" 0;
    ~*(bot|spider|crawler|curl|wget|python|headless) 0;
}
map "$request_method:$status:$me_stats_page:$me_stats_browser" $me_stats_count {
    default 0;
    ~^GET:(200|304):1:1$ 1;
}
map $time_iso8601 $me_stats_day {
    "~^(?<me_date>\d{4}-\d{2}-\d{2})" $me_date;
}
log_format me_daily '$me_stats_day';
