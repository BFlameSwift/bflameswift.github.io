# Include inside the personal site's HTTPS server after nginx-http.conf is loaded.
access_log /var/log/nginx/access.log combined;
access_log /var/log/nginx/me-bflame-daily.log me_daily if=$me_stats_count;
location = /stats/daily.json {
    alias /var/www/me.bflame.top/shared/stats/daily.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
